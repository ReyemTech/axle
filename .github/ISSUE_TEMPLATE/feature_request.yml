name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/ReyemTech/axle/blob/main/ROADMAP.md) first; your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like Axle to do? Tools, UI, configuration, API?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other designs you thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Server
        - MCP tools
        - Bridge
        - Harness adapters
        - Web UI
        - HTTP API
        - Deployment
        - Documentation
