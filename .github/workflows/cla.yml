name: cla

# pull_request_target runs with the base repo's token. This workflow must never check out or
# execute pull request code, and the action below only reads PR metadata and comments.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # writes signatures/cla.json to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      (github.event.comment.body == 'recheck'
      || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
      || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/ReyemTech/axle/blob/main/CLA.md
          branch: cla-signatures
          allowlist: ReyemTech,dependabot[bot],github-actions[bot]
