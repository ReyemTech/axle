name: docker

# Runs after the dist "Release" workflow succeeded for a v* tag, and packages the Linux
# binaries it published (Dockerfile.release). Nothing compiles here, and a failed release
# leaves no image behind.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && startsWith(github.event.workflow_run.head_branch, 'v') }}
    permissions:
      contents: read
      packages: write
      id-token: write # GitHub OIDC for the optional ECR push
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve version and owner
        id: meta
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          version="${TAG#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$version" != "$crate" ]; then
            echo "tag $TAG does not match Cargo.toml version $crate" >&2
            exit 1
          fi
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$version"
            echo "owner=$owner"
            echo "tags<<EOF"
            echo "ghcr.io/${owner}/axle:${version}"
            echo "ghcr.io/${owner}/axle:latest"
            if [ -n "$ECR_REGISTRY" ]; then
              echo "${ECR_REGISTRY}/${ECR_REPOSITORY:-axle}:${version}"
              echo "${ECR_REGISTRY}/${ECR_REPOSITORY:-axle}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download the released Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch="${pair%%:*}"; target="${pair#*:}"
            archive="axle-mcp-${target}.tar.xz"
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dl -p "$archive" -p "$archive.sha256"
            (cd dl && sha256sum -c "$archive.sha256")
            mkdir -p "bin/$arch"
            tar -xJf "dl/$archive" -C dl
            install -m 755 "$(find dl -type f -name axl -path "*${target}*" | head -n1)" "bin/$arch/axl"
          done
          file bin/*/axl

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional Amazon ECR push: a no-op until the owner sets vars.ECR_REGISTRY.
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.ECR_REGISTRY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        if: ${{ vars.ECR_REGISTRY != '' }}
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: ${{ vars.ECR_REGISTRY_TYPE || 'private' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=axle
            org.opencontainers.image.description=Self-hosted MCP server for coding agents: durable cross-machine messaging and task claims with renewable leases, plus a live web UI.
            org.opencontainers.image.source=https://github.com/ReyemTech/axle
            org.opencontainers.image.url=https://github.com/ReyemTech/axle
            org.opencontainers.image.documentation=https://github.com/ReyemTech/axle/tree/main/docs
            org.opencontainers.image.licenses=Elastic-2.0
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          # GHCR reads the description and repo link of a multi-arch image from the index.
          annotations: |
            index:org.opencontainers.image.description=Self-hosted MCP server for coding agents: durable cross-machine messaging and task claims with renewable leases, plus a live web UI.
            index:org.opencontainers.image.source=https://github.com/ReyemTech/axle
            index:org.opencontainers.image.licenses=Elastic-2.0

      - uses: azure/setup-helm@v4

      - name: Package and push chart
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          VERSION: ${{ steps.meta.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package deploy/helm/axle --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/axle-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"
