name: ci

# Docs-only changes skip CI. Any change outside these paths runs everything.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    paths-ignore: *docs

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Release PRs only bump the version and changelog of code main already tested,
    # and the tag build compiles everything again.
    if: ${{ !startsWith(github.head_ref, 'release-plz-') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: x
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AXL_TEST_PG_URL: postgres://postgres:x@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # PRs restore main's cache but never save their own, so it stays small and fresh.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features pg-tests -- -D warnings
      # pg-tests only adds the Postgres tests, so this one run covers SQLite too.
      - run: cargo test --features pg-tests

  helm:
    if: ${{ !startsWith(github.head_ref, 'release-plz-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/axle
      - name: Render both value sets
        run: |
          for f in deploy/helm/axle/ci/*.yaml; do
            helm lint deploy/helm/axle -f "$f"
            helm template t deploy/helm/axle -f "$f" > /dev/null
          done
      - name: Chart assertions
        run: bash tests/helm.sh

  smoke:
    if: ${{ !startsWith(github.head_ref, 'release-plz-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: axle-smoke:ci
          cache-from: type=gha,scope=smoke
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=smoke' || '' }}
      - run: bash tests/smoke.sh
        env:
          AXL_SMOKE_IMAGE: axle-smoke:ci
