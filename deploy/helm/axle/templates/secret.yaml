{{- if not .Values.adminSecret.existingSecret }}
{{- /* Generated once, then reused on upgrade so the UI secret does not rotate. */}}
{{- $name := include "axle.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $value := randAlphaNum 32 | b64enc }}
{{- if and $existing $existing.data }}
{{- $value = index $existing.data .Values.adminSecret.key | default $value }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "axle.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.adminSecret.key }}: {{ $value | quote }}
{{- end }}
