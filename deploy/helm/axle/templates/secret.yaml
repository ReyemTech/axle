{{- $auth := .Values.ui.auth }}
{{- if and (eq $auth.mode "secret") (not $auth.secret.existingSecret) }}
{{- /* The given value, else generated once and reused on upgrade so it does not rotate. */}}
{{- $name := include "axle.fullname" . }}
{{- $value := randAlphaNum 32 | b64enc }}
{{- if $auth.secret.value }}
{{- $value = $auth.secret.value | b64enc }}
{{- else }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data }}
{{- $value = index $existing.data $auth.secret.key | default $value }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "axle.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $auth.secret.key }}: {{ $value | quote }}
{{- end }}
