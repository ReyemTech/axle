{{- include "axle.validateUi" . }}
{{- $sqlite := eq .Values.database.mode "sqlite" }}
{{- $auth := .Values.ui.auth }}
{{- $extraNames := list }}
{{- range .Values.extraEnv }}{{- $extraNames = append $extraNames .name }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axle.fullname" . }}
  labels:
    {{- include "axle.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if $sqlite }}
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "axle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axle.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "axle.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: axle
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--bind", "0.0.0.0:7420"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 7420
              protocol: TCP
          env:
            - name: DATABASE_URL
              {{- if $sqlite }}
              value: sqlite:///data/axl.db
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.urlKey }}
              {{- end }}
            - name: AXL_UI_AUTH
              value: {{ include "axle.uiAuth" . | quote }}
            {{- if eq $auth.mode "secret" }}
            - name: AXL_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "axle.adminSecretName" . }}
                  key: {{ $auth.secret.key }}
            {{- else if eq $auth.mode "trustedHeader" }}
            - name: AXL_TRUSTED_HEADER
              value: {{ trim $auth.trustedHeader.name | quote }}
            {{- end }}
            - name: AXL_ALLOWED_HOSTS
              value: {{ include "axle.allowedHosts" . | quote }}
            - name: AXL_COOKIE_SECURE
              value: {{ include "axle.cookieSecure" . | quote }}
            {{- with include "axle.publicUrl" . }}
            {{- if not (has "AXL_PUBLIC_URL" $extraNames) }}
            - name: AXL_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with include "axle.trustedProxyHeader" . }}
            {{- if not (has "AXL_TRUSTED_PROXY_HEADER" $extraNames) }}
            - name: AXL_TRUSTED_PROXY_HEADER
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 7420
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 7420
            periodSeconds: 5
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $sqlite }}
            - name: data
              mountPath: /data
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $sqlite }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "axle.fullname" . }}-data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
