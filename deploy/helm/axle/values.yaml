# Axle runs as a single replica in the MVP; the schema rejects anything else.
replicaCount: 1

image:
  repository: ghcr.io/reyemtech/axle
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

database:
  # sqlite: a PVC mounted at /data, DATABASE_URL=sqlite:///data/axl.db, Recreate strategy.
  # postgres: the URL is read from an existing Secret; no PVC, RollingUpdate with maxSurge 0.
  mode: sqlite
  # postgres mode only: the Secret holding the connection URL and the key inside it.
  existingSecret: ""
  urlKey: DATABASE_URL

persistence:
  # sqlite mode only.
  size: 1Gi
  # Leave empty for the cluster default storage class.
  storageClass: ""

# How a human signs in to the web UI. Agent bearer tokens (MCP and /v1) are separate and
# always required. Examples for every mode are in the chart README.
ui:
  auth:
    # secret        - sign in with an admin secret (AXL_UI_AUTH=secret).
    # none          - no sign-in: everyone who reaches the UI acts as the human. Only for
    #                 deploys reachable solely over a VPN or through an authenticating proxy.
    # trustedHeader - an auth proxy (e.g. oauth2-proxy) signs requests in by setting a header.
    mode: secret
    # mode: secret only.
    secret:
      # Use an existing Secret instead of creating one. Set this for GitOps or Pulumi: they
      # render with `helm template`, where the chart cannot look up a generated Secret, so a
      # generated value would change on every render.
      existingSecret: ""
      # Key inside the Secret (the existing one, or the one the chart creates).
      key: admin-secret
      # Optional fixed value (at least 16 characters). Empty: the chart generates one once
      # and keeps it across upgrades. Cannot be combined with existingSecret.
      value: ""
    # mode: trustedHeader only.
    trustedHeader:
      # The header your auth proxy sets (AXL_TRUSTED_HEADER), e.g. X-Auth-Request-Email.
      # Required in this mode. The proxy must strip it from client requests.
      name: ""
  # Extra Host names the UI answers to (AXL_ALLOWED_HOSTS). Ingress hosts and the in-cluster
  # service names are added automatically. Enforced when the UI has no sign-in, against DNS
  # rebinding.
  allowedHosts: []
  # Mark the UI session cookie Secure (AXL_COOKIE_SECURE). null: on when the ingress has TLS.
  cookieSecure: null

service:
  type: ClusterIP
  port: 7420

ingress:
  enabled: false
  className: ""
  # Axle streams events over SSE, so the proxy must not buffer responses and must keep idle
  # connections open. Example for ingress-nginx:
  #   annotations:
  #     nginx.ingress.kubernetes.io/proxy-buffering: "off"
  #     nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #     nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  annotations: {}
  hosts: []
  #  - host: axle.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  tls: []
  #  - secretName: axle-tls
  #    hosts: [axle.example.com]

extraEnv: []
#  - name: AXL_RATE_LIMIT_PER_SEC
#    value: "50"

resources: {}

# The server drains in-flight requests for up to 5 s on SIGTERM.
terminationGracePeriodSeconds: 15

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # Lets the nonroot user write the /data volume.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
