# Axle built-in API price table. USD per million tokens (= micro-USD per token).
#
# Sources, read on 2026-11-28:
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
#              (model ids from the Claude API model list)
#   OpenAI:    https://developers.openai.com/api/docs/pricing (Standard tier)
#
# Models whose price this table could not verify are omitted on purpose: they show "no price".
# Override or extend with AXL_PRICES_FILE (same format; entries replace these by id).
# OpenAI entries carry input, cache_read and output only. OpenAI models that bill a higher
# rate above a context threshold (gpt-5.5, gpt-5.4 and their pro variants) are left out
# rather than priced wrongly for long prompts.

version = "2026-11-28"

# ---- Anthropic -------------------------------------------------------------

[[model]]
id = "claude-fable-5-2"
match = ["claude-fable-5-2-*", "anthropic/claude-fable-5-2*"]
input = 8.00
output = 40.00
cache_write_5m = 10.00
cache_write_1h = 16.00
cache_read = 0.20
fast = { input = 16.00, output = 80.00 }
# source: Anthropic pricing page, model pricing and fast mode tables

[[model]]
id = "claude-fable-5-1"
