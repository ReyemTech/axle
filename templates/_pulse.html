<span class="pulse-item" title="Agents with a live session"><span class="aspect" data-aspect="{% if live > 0 %}live{% else %}none{% endif %}" aria-hidden="true"></span><span class="num">{{ live }}</span> live</span>
<a class="pulse-item{% if blocked > 0 %} is-alert{% endif %}" href="/ui/board" title="Tasks waiting on someone"><span class="aspect" data-aspect="{% if blocked > 0 %}blocked{% else %}none{% endif %}" aria-hidden="true"></span><span class="num">{{ blocked }}</span> blocked</a>
