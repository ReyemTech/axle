<span class="pulse-item" title="Agents with a live session"><span class="aspect" data-aspect="{% if p.live > 0 %}live{% else %}none{% endif %}" aria-hidden="true"></span><span class="num">{{ p.live }}</span> live</span>
<a class="pulse-item{% if p.blocked > 0 %} is-alert{% endif %}" href="/ui/board" title="Tasks waiting on someone"><span class="aspect" data-aspect="{% if p.blocked > 0 %}blocked{% else %}none{% endif %}" aria-hidden="true"></span><span class="num">{{ p.blocked }}</span> blocked</a>
<a class="pulse-item{% if p.need > 0 %} is-alert{% endif %}" href="/ui/board#needs-you" title="Plans to approve, tasks blocked on you, work to review and urgent messages waiting on you"><span class="aspect" data-aspect="{% if p.need > 0 %}plan-submitted{% else %}none{% endif %}" aria-hidden="true"></span><span class="num">{{ p.need }}</span> need you</a>
