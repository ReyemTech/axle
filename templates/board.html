{% extends "base.html" %}
{% block title %}Board{% endblock %}
{% block content %}
<div class="board-bar">
  <nav class="lines" aria-label="Projects">
    <a href="/ui/board"{% if filter.is_none() %} aria-current="page"{% endif %}><span class="line-swatch" data-line="all" aria-hidden="true"></span>All projects</a>
    {% for p in projects %}<a href="/ui/board?project={{ p.id }}" title="{{ p.key }}"{% if p.selected %} aria-current="page"{% endif %}><span class="line-swatch" data-line="{{ p.line }}" aria-hidden="true"></span>{{ p.name }}</a>{% endfor %}
  </nav>
  {% if let Some(token) = csrf %}{% if !projects.is_empty() %}
  <details class="new-task">
    <summary class="button-like">New task</summary>
    <form class="stack" method="post" action="/ui/tasks">
      <input type="hidden" name="csrf" value="{{ token }}">
      <label for="new-project">Project</label>
      <select id="new-project" name="project" required>
        {% for p in projects %}<option value="{{ p.id }}" title="{{ p.key }}"{% if p.selected %} selected{% endif %}>{{ p.name }}</option>{% endfor %}
      </select>
      <label for="new-title">Title</label>
      <input id="new-title" name="title" required>
      <label for="new-body">Details</label>
      <textarea id="new-body" name="body" rows="4"></textarea>
      <button type="submit">Create task</button>
    </form>
  </details>
  {% endif %}{% endif %}
</div>
<div id="columns" class="columns"
     hx-get="/ui/board/columns{% if let Some(id) = filter %}?project={{ id }}{% endif %}"
     hx-trigger="sse:board delay:300ms" hx-swap="innerHTML">
{% include "_columns.html" %}
</div>
{% endblock %}
