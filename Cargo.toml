[package]
name = "coord"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
clap = { version = "4.6.10", features = ["derive"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "macros", "migrate", "uuid", "time"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["macros"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[features]
pg-tests = []

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
