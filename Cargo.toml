[package]
name = "coord"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.10", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "macros", "migrate", "uuid", "time"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[features]
pg-tests = []
