[package]
name = "axle-mcp"
version = "0.1.0"
edition = "2024"
description = "Axle: self-hosted MCP server for agent messaging and task claiming with leases"
license = "Elastic-2.0"
repository = "https://github.com/ReyemTech/axle"
homepage = "https://github.com/ReyemTech/axle#readme"
readme = "README.md"
keywords = ["mcp", "agents", "coordination", "tasks", "leases"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/migrations/**",
    "/templates/**",
    "/static/**",
    "/build.rs",
    "/README.md",
    "/LICENSE",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/axle-mcp-{ target }.tar.xz"
bin-dir = "axle-mcp-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tar.xz"

[lib]
name = "axle"
path = "src/lib.rs"

[[bin]]
name = "axl"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
clap = { version = "4.6.10", features = ["derive"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.12.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server", "transport-io", "client", "transport-streamable-http-client-reqwest", "reqwest"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "macros", "migrate", "uuid", "time"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["macros"] }
toml = "0.9"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.29.3", features = ["v7", "serde", "v5"] }
askama = "0.16.1"
serde_urlencoded = "0.7.1"

[features]
pg-tests = []

[dev-dependencies]
http-body-util = "0.1.5"
scraper = "0.29.0"
tokio = { version = "1.54.1", features = ["io-util", "process"] }
tower = { version = "0.5.3", features = ["util"] }
